name: Build, publish, and smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-publish-smoke-test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%.7s' "$GITHUB_SHA")"

          echo "IMAGE_TAG=${REGISTRY}/${repository}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${short_sha}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE_TAG" \
            .

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish image
        run: docker push "$IMAGE_TAG"

      - name: Pull published image
        run: |
          docker image rm "$IMAGE_TAG"
          docker pull "$IMAGE_TAG"

      - name: Start application
        run: |
          docker run --detach \
            --name go-version-app-ci \
            --publish 127.0.0.1:3000:3000 \
            --env VERSION="$APP_VERSION" \
            "$IMAGE_TAG"

      - name: Run HTTP smoke test
        shell: bash
        run: |
          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:3000/)"

          expected="We're up and running!! Rocking Version: ${APP_VERSION}"
          echo "$response"

          if [[ "$response" != "$expected" ]]; then
            echo "Unexpected application response" >&2
            exit 1
          fi

      - name: Clean up container
        if: always()
        run: docker rm --force go-version-app-ci 2>/dev/null || true
